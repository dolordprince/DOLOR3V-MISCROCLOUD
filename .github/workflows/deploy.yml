name: DOLOR3V Microcloud — Build Container + Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build Container and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript verification
        run: npx tsc --noEmit

      - name: Deploy Worker + Container
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --containers-rollout=immediate

      - name: Verify deployed Worker
        run: |
          set -u

          URL="https://dolor3v-microcloud.personaldolor.workers.dev"

          echo "============================================================"
          echo " DOLOR3V REMOTE VERIFICATION"
          echo "============================================================"

          HTTP_CODE="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/api/health")"

          echo "HTTP: $HTTP_CODE"
          cat /tmp/health.json
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "REMOTE WORKER VERIFICATION: FAIL"
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
            if (x.ok !== true) process.exit(1);
            if (x.durableObjects !== true) process.exit(1);
            if (x.agents !== true) process.exit(1);
            console.log("REMOTE WORKER VERIFICATION: PASS");
          '

      - name: Verify Sandbox execution
        run: |
          set -u

          URL="https://dolor3v-microcloud.personaldolor.workers.dev/api/sandbox/health?workspaceId=github-ci-verification"

          echo "============================================================"
          echo " DOLOR3V SANDBOX VERIFICATION"
          echo "============================================================"

          HTTP_CODE="$(curl -sS -o /tmp/sandbox.json -w '%{http_code}' "$URL")"

          echo "HTTP: $HTTP_CODE"
          cat /tmp/sandbox.json
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "SANDBOX EXECUTION: FAIL"
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/sandbox.json", "utf8"));
            if (x.ok !== true) process.exit(1);
            console.log("SANDBOX EXECUTION: PASS");
          '

          echo "============================================================"
          echo " DEPLOYMENT VERIFIED"
          echo "============================================================"
